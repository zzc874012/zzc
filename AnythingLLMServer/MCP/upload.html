<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>AnythingLLM 文档上传</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 24px; }
  #log { white-space: pre-wrap; background: #f5f5f5; padding: 12px; border-radius: 6px; margin-top: 12px; }
  button { margin-left: 8px; }
</style>
</head>
<body>
  <h2>AnythingLLM 文档上传 + 向量化嵌入</h2>
  <div>
    <input type="file" id="file">
    <button id="btn">上传并嵌入</button>
  </div>
  <pre id="log"></pre>

<script>
const API_BASE = "http://localhost:3001/api/v1";
const API_KEY = "YOUR_ANYTHINGLLM_API_KEY";
const logEl = document.getElementById("log");
const btn = document.getElementById("btn");
const log = (msg) => { logEl.textContent += msg + "\n"; };

btn.onclick = async () => {
  logEl.textContent = "";
  const file = document.getElementById("file").files[0];
  if (!file) { log("请先选择文件"); return; }

  btn.disabled = true;
  try {
    // 1. 取第一个工作区 slug
    log("获取第一个工作区...");
    const wsRes = await fetch(`${API_BASE}/workspaces`, {
      headers: { Authorization: `Bearer ${API_KEY}` }
    });
    if (!wsRes.ok) throw new Error(`工作区请求失败: HTTP ${wsRes.status}`);
    const wsData = await wsRes.json();
    const ws = wsData.workspaces && wsData.workspaces[0];
    if (!ws) throw new Error("没有可用工作区");
    const slug = ws.slug;
    log(`第一个工作区: ${ws.name} (slug=${slug})`);

    // 2. 上传并通过 addToWorkspaces 在同一次调用内完成向量化嵌入
    log(`上传并嵌入: ${file.name} ...`);
    const fd = new FormData();
    fd.append("file", file);
    fd.append("addToWorkspaces", slug);
    const upRes = await fetch(`${API_BASE}/document/upload`, {
      method: "POST",
      headers: { Authorization: `Bearer ${API_KEY}` },
      body: fd
    });
    const upData = await upRes.json();
    if (!upRes.ok || !upData.success) throw new Error(`上传失败: HTTP ${upRes.status} ${JSON.stringify(upData)}`);

    const docs = upData.documents || [];
    log(`完成。已上传 ${docs.length} 个文档并嵌入工作区「${ws.name}」:`);
    docs.forEach(d => log(`  - ${d.title} -> ${d.location}`));
  } catch (e) {
    log("错误: " + e.message);
  } finally {
    btn.disabled = false;
  }
};
</script>
</body>
</html>
