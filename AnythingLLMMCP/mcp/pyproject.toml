[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "anythingllm-mcp"
version = "0.1.0"
description = "MCP server exposing local AnythingLLM workspace chat via Streamable HTTP (MCP 2026-07-28)."
requires-python = ">=3.10"
dependencies = [
    "mcp==2.2.0",
    "httpx>=0.27",
    "uvicorn>=0.30",
]
