[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pet-hospital-mcp"
version = "0.1.0"
description = "Stateless MCP service exposing the Go Pet Hospital REST API to AI agents (SDK 2.x, protocol 2026-07-28)."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Pet Hospital MCP Teaching" }]
license = { text = "MIT" }

dependencies = [
    "mcp==2.0.0",
    "httpx>=0.27",
    "pydantic>=2.6",
    "uvicorn>=0.30",
    "starlette>=0.37",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
]

[project.scripts]
pet-hospital-mcp = "pet_hospital_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"
