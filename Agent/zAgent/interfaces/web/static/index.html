<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>zAgent · LLM 文件操作智能体</title>
<link rel="stylesheet" href="/static/style.css" />
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">
      <span class="logo">zAgent</span>
      <span class="subtitle" id="subtitle">加载中…</span>
    </div>
    <div class="actions">
      <button id="btn-reset" type="button" title="清空对话">清空</button>
    </div>
  </header>

  <main id="chat" class="chat" aria-live="polite"></main>

  <footer class="composer">
    <div id="status" class="status info">就绪</div>
    <div class="input-row">
      <textarea id="prompt" rows="2" placeholder="输入消息，Enter 发送，Shift+Enter 换行"
                autocomplete="off"></textarea>
      <button id="btn-send" type="button">发送</button>
      <button id="btn-cancel" type="button" hidden>取消</button>
    </div>
  </footer>
</div>
<script src="/static/app.js"></script>
</body>
</html>
